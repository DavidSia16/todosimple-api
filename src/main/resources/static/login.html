<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ToDo Simple - Sistema</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR SUPERIOR (Exibida apenas após o login) -->
<nav id="navbar" class="navbar hidden">
    <div class="nav-brand">
        <!-- LOGO VETORIAL ELEGANTE -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="6" fill="#007BFF"/>
            <path d="M7 12.5L10.5 16L17 8.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>ToDo Simple</h1>
    </div>
    <div class="nav-user">
        <span id="userInfo">Minha Conta</span>
        <button onclick="logout()" class="btn-danger btn-small">Sair</button>
    </div>
</nav>

<!-- WRAPPER CENTRALIZADO -->
<div class="main-wrapper">
    <div class="container">

        <!-- TELA DE LOGIN -->
        <div id="loginSection">
            <div style="text-align: center; margin-bottom: 20px;">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 48px; height: 48px; margin-bottom: 10px;">
                    <rect width="24" height="24" rx="6" fill="#007BFF"/>
                    <path d="M7 12.5L10.5 16L17 8.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h2>Bem-vindo de volta</h2>
                <p style="color: #6c757d; font-size: 14px; margin: 0;">Faça login para gerenciar suas tarefas</p>
            </div>

            <form id="loginForm">
                <div>
                    <label for="username">Usuário:</label>
                    <input type="text" id="username" required />
                </div>
                <div>
                    <label for="password">Senha:</label>
                    <input type="password" id="password" required />
                </div>
                <button type="submit">Entrar</button>
            </form>

            <div class="register-link">
                <p>Não tem uma conta? <a href="register.html">Cadastre-se agora</a></p>
            </div>
        </div>

        <!-- PAINEL PRINCIPAL DE TAREFAS -->
        <div id="appSection" class="hidden">
            <h3 class="section-title">Criar Nova Tarefa</h3>
            <form id="taskForm" style="margin-bottom: 25px;">
                <div class="form-group" style="margin-bottom: 10px;">
                    <input type="text" id="taskDescription" placeholder="O que você precisa fazer?" required>
                </div>
                <button type="submit">Adicionar Tarefa</button>
            </form>

            <hr class="divider">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 class="section-title" style="margin: 0;">Suas Tarefas</h3>
                <button onclick="carregarTarefas()" class="btn-secondary btn-small" style="margin: 0;">Atualizar</button>
            </div>

            <div id="taskList"></div>
        </div>

    </div>
</div>

<!-- Importação do JavaScript -->
<script src="js/script.js"></script>
</body>
</html>
